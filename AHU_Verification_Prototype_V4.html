<!DOCTYPE html><html><head><meta charset="utf-8"><title>AHU Verification Prototype V4</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6}#app{display:flex;height:100vh}.sidebar{width:260px;background:#1f2937;color:white;padding:12px;overflow:auto}.content{flex:1;padding:15px;overflow:auto}.nav{padding:10px;background:#374151;margin-bottom:6px;border-radius:6px;cursor:pointer}.btn{width:100%;padding:10px;background:#2563eb;color:#fff;border:none;border-radius:6px}.page{background:#fff;padding:12px;border-radius:8px}.home{display:grid;grid-template-columns:450px 1fr;gap:12px}.fields{background:#b7dca5;padding:8px}.row{display:grid;grid-template-columns:160px 1fr 70px;gap:4px;align-items:center;margin:2px 0}.row label{text-align:right;font-weight:bold}.row input,.row select{height:24px}.sqrow{display:grid;grid-template-columns:35px 1fr}.sqrow input{width:100%;border:none;border-top:1px solid #aaa;height:24px}.num{border-top:1px solid #aaa;text-align:right;padding-right:5px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center}.box{background:white;width:800px;max-height:90vh;overflow:auto;padding:20px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}</style></head><body><div id="app"><div class="sidebar"><h2>AHU Verification</h2><div id="tabs"></div><button class="btn" onclick="openModal()">+ Add Skid</button></div><div class="content"><div id="page"></div></div></div><div id="modal" class="modal"><div class="box"><h2>Create Skid</h2><label>Skid Name</label><input id="skidName" style="width:100%"><div class="cols"><div><h3>Segments</h3><div id="segments"></div><br>Other Segment:<input id="customSeg" style="width:100%"></div><div><h3>Internals</h3><div id="internals"></div><br>Other Internal:<input id="customInt" style="width:100%"></div></div><br><button onclick="saveSkid()">Create</button><button onclick="closeModal()">Cancel</button></div></div><script>
const segmentList=[`AB - Air Blender`,`AF - Angle Filter`,`AT - Sound Attenuator`,`CC - Coil (Cooling)`,`DI - Diffuser`,`DP - Discharge Plenum`,`EB - External Bypass`,`EE - Economizer`,`EF - Filter Economizer`,`EH - Electric Heat`,`FD - Face Damper`,`FE - Fan (Exhaust)`,`FF - Flat Filter`,`FM - Filter Mixing Box`,`FR - Fan (Return)`,`FS - Fan (Supply)`,`HC - Coil (Heating)`,`HD - Hot Deck`,`HF - HEPA Filter`,`HM - Humidifier`,`HW - Heat Wheel`,`HX - Heat Exchanger`,`IB - Internal Bypass`,`IC - Integrated Face and Bypass Coil`,`IG - Indirect Fired Gas`,`IO - Inlet / Outlet`,`IP - Inlet Plenum`,`MB - Mixing Box`,`PC - Pipe Chase`,`RF - High Efficiency Filter`,`TN - Turning`,`UV - UV Light`,`VC - Vertical Coil`,`VE - Vertical Economizer`,`VB - Vestibule / Corridor`,`VP - Vertical Plenum`,`XA - Access`];
const internalList=[`Access Panel`,`Air Blender`,`Angle Filter`,`Coil (Cooling)`,`Coil (DX)`,`Coil (Heating)`,`Coil (Split)`,`Coil (SQ)`,`Coil (Staggered)`,`Coil (Wing/IC)`,`Coil Panel`,`Damper Wall`,`Drain Pan`,`Drain Pan (Aux)`,`EBM Fan Wall`,`Electric Heater`,`Filter (HEPA)`,`Flat Filter`,`Heat Exchanger`,`Heat Wheel`,`Humidifier`,`Indirect Gas Heater`,`Perf Basket(s)`,`Rigid Filter`,`Sound Attenuator`,`UV Light Wall`];
segmentList.forEach(x=>segments.innerHTML+=`<div><input type='checkbox' value='${x}'> ${x}</div>`);internalList.forEach(x=>internals.innerHTML+=`<div><input type='checkbox' value='${x}'> ${x}</div>`);
let skids=[];
function renderTabs(){tabs.innerHTML='<div class="nav" onclick="showGeneral()">General Unit</div>'+skids.map(s=>`<div class='nav' onclick="showSkid('${s.id}')">${s.id}</div>`).join('');}
function showGeneral(){let left='';['Detailer','Date','Job Name','COM#','Shell Type','Unit Type','Base Height','Wall Thickness','Thermal Break','Roof Peak','Curbrest','NOA','Seismic','Location','Knockdown','UTL'].forEach((f,i)=>{let val=f==='Date'?new Date().toISOString().split('T')[0]:'';left+=`<div class='row'><label>${f}</label><input value='${val}'><div></div></div>`});left+=`<div class='row'><label>Liner Material</label><input><input placeholder='Gauge'></div><div class='row'><label>Skin Material</label><input><input placeholder='Gauge'></div><div class='row'><label>Floor Material</label><input><input placeholder='Gauge'></div><h4>Additional Comments</h4><textarea style='width:100%;height:120px'></textarea>`;let sq='';for(let i=1;i<=22;i++)sq+=`<div class='sqrow'><div class='num'>${i}</div><input></div>`;page.innerHTML=`<div class='page home'><div class='fields'>${left}</div><div><h3>SQ's & Deviation Items Related to Detailing</h3>${sq}</div></div>`;}
function showSkid(id){let s=skids.find(x=>x.id===id);page.innerHTML=`<div class='page'><h2>${s.id}</h2><h3>Segments</h3><ul>${s.seg.map(x=>'<li>'+x+'</li>').join('')}</ul><h3>Internals</h3><ul>${s.int.map(x=>'<li>'+x+'</li>').join('')}</ul><h3>Generated Verification Groups</h3><ul>${[...s.seg,...s.int].map(x=>'<li>'+x+'</li>').join('')}</ul></div>`;}
function openModal(){modal.style.display='flex';skidName.value='Skid '+(skids.length+1)}function closeModal(){modal.style.display='none'}
function saveSkid(){let seg=[...document.querySelectorAll('#segments input:checked')].map(x=>x.value);let ints=[...document.querySelectorAll('#internals input:checked')].map(x=>x.value);if(customSeg.value)seg.push('CUSTOM - '+customSeg.value);if(customInt.value)ints.push('CUSTOM - '+customInt.value);let s={id:skidName.value,seg:seg,int:ints};skids.push(s);closeModal();renderTabs();showSkid(s.id);}renderTabs();showGeneral();
</script></body></html>

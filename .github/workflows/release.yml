name: Production Release & Installer Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or v1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Version
        id: semver
        shell: pwsh
        run: |
          $rawVer = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "${{ github.event.inputs.version }}"
          }
          $cleanVer = $rawVer.TrimStart('v')
          Write-Host "Configuring build for release version: $cleanVer"
          "version=$cleanVer" >> $env:GITHUB_OUTPUT
          "tag=v$cleanVer" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies and build frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate Rule Pack integrity
        shell: pwsh
        run: |
          node scripts/build_rulepack.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Backend Tests
        run: dotnet test tests/AHUVerification.Tests/AHUVerification.Tests.csproj -c Release

      - name: Publish Detailer App (Self-Contained win-x64)
        run: dotnet publish src/backend/AHUVerification.App/AHUVerification.App.csproj -c Release -r win-x64 --self-contained true -o publish/AHUVerification /p:Version=${{ steps.semver.outputs.version }}

      - name: Validate Packaged Native Assets
        shell: pwsh
        run: |
          $required = @(
            'publish/AHUVerification/AHUVerification.App.exe',
            'publish/AHUVerification/dist/index.html',
            'publish/AHUVerification/resources/rulepack/manifest.json',
            'publish/AHUVerification/resources/bin/unpack32.exe',
            'publish/AHUVerification/resources/bin/ywunpack.dll'
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) {
              Write-Error "Missing required release asset: $p"
              exit 1
            }
          }

      - name: Install Velopack CLI Tool
        shell: pwsh
        run: |
          dotnet tool install -g vpk

      - name: Package Velopack 1-Click Installer
        shell: pwsh
        run: |
          vpk pack --packId AHUVerification --packVersion ${{ steps.semver.outputs.version }} --packDir publish/AHUVerification --mainExename AHUVerification.App.exe -o Releases

      - name: Publish Rule Editor Studio (Self-Contained win-x64)
        run: dotnet publish src/backend/AHUVerification.RuleEditor/AHUVerification.RuleEditor.csproj -c Release -r win-x64 --self-contained true -o publish/RuleEditor /p:Version=${{ steps.semver.outputs.version }}

      - name: Archive Rule Editor Admin Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/RuleEditor/* -DestinationPath "RuleEditor-${{ steps.semver.outputs.version }}-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: AHU Verification Desktop ${{ steps.semver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Releases/AHUVerification-Setup.exe
            Releases/*-full.nupkg
            Releases/*-delta.nupkg
            Releases/releases.win.json
            RuleEditor-${{ steps.semver.outputs.version }}-win-x64.zip


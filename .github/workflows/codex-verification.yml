name: Codex Verification

on:
  workflow_call:
    inputs:
      publish_artifacts:
        description: 'Build Windows publish artifacts after verification'
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'ci/**'
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:
    inputs:
      publish_artifacts:
        description: 'Build Windows publish artifacts after verification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: codex-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  verify:
    name: Windows build and verification
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.408'

      - name: Capture toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --info

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript and build Vite frontend
        run: npm run build

      - name: Verify version metadata
        run: npm run test:version

      - name: Verify packaged entry assets
        run: npm run test:dist

      - name: Verify bundle size budget
        run: npm run test:bundle

      - name: Validate rule-pack integrity
        shell: pwsh
        run: |
          $manifestPath = 'resources/rulepack/manifest.json'
          $before = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $beforeBundle = $before.bundleSha256

          node scripts/build_rulepack.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $after = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($beforeBundle -ne $after.bundleSha256) {
            Write-Error "Rule-pack manifest is stale. Stored bundleSha256: $beforeBundle; generated: $($after.bundleSha256)"
            git diff -- resources/rulepack
            exit 1
          }
          $dirty = git status --porcelain -- resources/rulepack
          if ($dirty) {
            Write-Error "Rule-pack generation changed tracked files. Commit the canonical generated output before merging."
            Write-Host $dirty
            exit 1
          }

      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet restore AHUVerification.sln

      - name: Build .NET solution
        run: dotnet build AHUVerification.sln -c Release --no-restore

      - name: Run .NET test suite and Core coverage gate
        shell: pwsh
        run: npm run test:coverage

      - name: Run AST converter tests
        run: node scripts/test_ast_converter.mjs

      - name: Run fact contract parity tests
        run: node scripts/test_fact_contract.mjs

      - name: Run canonical DVL contract tests
        run: node scripts/test_dvl_canonical.mjs

      - name: Run state reducers and domain logic tests
        run: node scripts/test_reducers.mjs

      - name: Run readiness tests
        run: node scripts/test_readiness.mjs

      - name: Run adversarial readiness tests
        run: node scripts/stress_test_readiness_adversarial.mjs

      - name: Run modal and keyboard accessibility tests
        run: node scripts/test_modal_accessibility.mjs

      - name: Run ingestion feedback tests
        run: node scripts/test_ingestion_feedback.mjs

      - name: Run copy and terminology linter
        run: node scripts/test_copy_linter.mjs

      - name: Run responsive layout and contrast tests
        run: node scripts/test_responsive_contrast.mjs

      - name: Run cross-engine parity and bridge tests
        run: node scripts/test_m2_parity_and_bridge.mjs

      - name: Verify checkout remains clean
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            Write-Error 'Verification modified tracked repository files.'
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.sha }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Chromium UI and accessibility verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Compile frontend before browser tests
        run: npm run build

      - name: Verify packaged entry assets
        run: npm run test:dist

      - name: Verify bundle size budget
        run: npm run test:bundle

      - name: Run Playwright UI and accessibility smoke tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces, screenshots, and videos
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Windows publish smoke test
    if: ${{ inputs.publish_artifacts == true }}
    needs: [verify, browser]
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.408'

      - name: Install dependencies and build frontend
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish detailer application
        run: dotnet publish src/backend/AHUVerification.App/AHUVerification.App.csproj -c Release -r win-x64 --self-contained true -o publish/AHUVerification

      - name: Publish rule editor
        run: dotnet publish src/backend/AHUVerification.RuleEditor/AHUVerification.RuleEditor.csproj -c Release -r win-x64 --self-contained true -o publish/RuleEditor

      - name: Validate required publish assets
        shell: pwsh
        run: |
          $required = @(
            'publish/AHUVerification/AHUVerification.App.exe',
            'publish/AHUVerification/dist/index.html',
            'publish/AHUVerification/dist/rule-editor.html',
            'publish/AHUVerification/version.json',
            'publish/AHUVerification/resources/rulepack/manifest.json',
            'publish/AHUVerification/resources/rulepack/rules.json',
            'publish/AHUVerification/resources/rulepack/template_map.json',
            'publish/AHUVerification/resources/rulepack/approved_mappings.json',
            'publish/AHUVerification/resources/rulepack/fact_contract.json',
            'publish/AHUVerification/resources/rulepack/template.xlsx',
            'publish/AHUVerification/resources/bin/unpack32.exe',
            'publish/AHUVerification/resources/bin/ywunpack.dll',
            'publish/RuleEditor/RuleEditor.exe',
            'publish/RuleEditor/dist/rule-editor.html',
            'publish/RuleEditor/version.json',
            'publish/RuleEditor/resources/rulepack/manifest.json',
            'publish/RuleEditor/resources/rulepack/rules.json',
            'publish/RuleEditor/resources/rulepack/template_map.json',
            'publish/RuleEditor/resources/rulepack/approved_mappings.json',
            'publish/RuleEditor/resources/rulepack/fact_contract.json',
            'publish/RuleEditor/resources/rulepack/template.xlsx'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              Write-Error "Required publish artifact is missing: $path"
              exit 1
            }
          }
          node scripts/verify_version.mjs --publish-dir publish/AHUVerification --publish-dir publish/RuleEditor

      - name: Upload Windows publish artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-publish-${{ github.sha }}
          path: publish/
          if-no-files-found: error
          retention-days: 7
